<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem('resolve:theme');
          dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e2) {}
        }
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html { background: #f4f7fc; }
      html.dark { background: #0b1120; }
    </style>
